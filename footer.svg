<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bgf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="100%" stop-color="#0d1128"/>
    </linearGradient>
    <filter id="glf">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="80" rx="12" fill="url(#bgf)"/>

  <!-- Animated top border wave -->
  <path d="M 0,10 Q 225,-5 450,10 T 900,10" fill="none" stroke="url(#fg)" stroke-width="1.5" opacity="0.5">
    <animate attributeName="d"
      values="M 0,10 Q 225,-5 450,10 T 900,10;
              M 0,16 Q 225,28 450,16 T 900,16;
              M 0,10 Q 225,-5 450,10 T 900,10"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Main footer wave fill -->
  <path d="M 0,30 Q 225,10 450,30 T 900,30 L 900,80 L 0,80 Z" fill="url(#fg)" opacity="0.08"/>
  <path d="M 0,45 Q 250,65 450,45 T 900,45 L 900,80 L 0,80 Z" fill="url(#fg)" opacity="0.05">
    <animate attributeName="d"
      values="M 0,45 Q 250,65 450,45 T 900,45 L 900,80 L 0,80 Z;
              M 0,38 Q 250,55 450,38 T 900,38 L 900,80 L 0,80 Z;
              M 0,45 Q 250,65 450,45 T 900,45 L 900,80 L 0,80 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Footer text -->
  <text x="450" y="55" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="11" font-weight="600" fill="url(#fg)" text-anchor="middle" letter-spacing="4"
    filter="url(#glf)" opacity="0.8">
    BUILT WITH PURPOSE · DEPLOYED WITH PRECISION · DRIVEN BY CURIOSITY
  </text>

  <!-- Glowing border -->
  <rect x="1" y="1" width="898" height="78" rx="11" fill="none" stroke="url(#fg)" stroke-width="0.8" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
