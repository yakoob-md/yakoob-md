<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <!-- Text / Glow Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Waving Background Shape -->
  <rect width="1000" height="200" rx="15" fill="url(#bgGrad)" />
  <path d="M 0,160 Q 250,200 500,160 T 1000,160 L 1000,200 L 0,200 Z" fill="#38bdf8" opacity="0.08" />
  <path d="M 0,140 Q 250,120 500,150 T 1000,140 L 1000,200 L 0,200 Z" fill="#a855f7" opacity="0.05" />

  <!-- Glowing Border -->
  <rect x="2" y="2" width="996" height="196" rx="13" fill="none" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Hey Everyone Header -->
  <text x="500" y="90" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="1.5">
    HEY EVERYONE! I'M YAKOOB M.D. 🕹️
  </text>
  
  <!-- Subtitle -->
  <text x="500" y="135" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">
    FULL-STACK &amp; GENERATIVE AI SYSTEMS ENGINEER
  </text>
  
  <!-- Subtle Coding Dots or Grid -->
  <circle cx="50" cy="50" r="1.5" fill="#38bdf8" opacity="0.3" />
  <circle cx="950" cy="50" r="1.5" fill="#a855f7" opacity="0.3" />
  <circle cx="50" cy="150" r="1.5" fill="#a855f7" opacity="0.3" />
  <circle cx="950" cy="150" r="1.5" fill="#38bdf8" opacity="0.3" />
</svg>
