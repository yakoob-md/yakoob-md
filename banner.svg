<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Deep dark bg gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="45%" stop-color="#0d1128"/>
      <stop offset="100%" stop-color="#150d2e"/>
    </linearGradient>

    <!-- Cyan-to-violet heading gradient -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Subtitle text gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Outer border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow filter for heading text -->
    <filter id="textGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.15" stroke-opacity="0.18"/>
    </pattern>

    <!-- Radial glow under heading -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="900" height="180" rx="16" fill="url(#bg)"/>
  <rect width="900" height="180" rx="16" fill="url(#grid)"/>
  <ellipse cx="450" cy="90" rx="360" ry="80" fill="url(#centerGlow)"/>

  <!-- ── Animated aurora waves ── -->
  <path d="M -100,145 Q 225,105 450,145 T 1000,145" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25">
    <animate attributeName="d"
      values="M -100,145 Q 225,105 450,145 T 1000,145;
              M -100,135 Q 225,165 450,135 T 1000,135;
              M -100,145 Q 225,105 450,145 T 1000,145"
      dur="7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.25;0.5;0.25" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M -100,160 Q 250,130 450,160 T 1000,160" fill="none" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.2">
    <animate attributeName="d"
      values="M -100,160 Q 250,130 450,160 T 1000,160;
              M -100,150 Q 250,170 450,150 T 1000,150;
              M -100,160 Q 250,130 450,160 T 1000,160"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- ── Animated glowing border ── -->
  <rect x="2" y="2" width="896" height="176" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Orbiting particles ── -->
  <circle r="2.5" fill="#38bdf8" opacity="0.7">
    <animateMotion path="M 450,90 m -320,0 a 320,55 0 1,1 0.001,0" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#c084fc" opacity="0.6">
    <animateMotion path="M 450,90 m 300,0 a 300,45 0 1,0 0.001,0" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.5" fill="#818cf8" opacity="0.5">
    <animateMotion path="M 450,90 m 0,-60 a 200,60 0 1,1 0.001,0" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Accent corner dots ── -->
  <circle cx="30" cy="30" r="2" fill="#38bdf8" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="30" r="2" fill="#c084fc" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="150" r="2" fill="#c084fc" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="150" r="2" fill="#38bdf8" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Main Headline ── -->
  <text
    x="450" y="84"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="40"
    font-weight="900"
    fill="url(#headGrad)"
    text-anchor="middle"
    filter="url(#textGlow)"
    letter-spacing="1.5">
    HEY EVERYONE! I'M YAKOOB M.D. 🕹️
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- ── Subtitle ── -->
  <text
    x="450" y="118"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="14"
    font-weight="600"
    fill="url(#subGrad)"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.9">
    FULL-STACK  ·  GENERATIVE AI  ·  SYSTEMS ENGINEER
  </text>

  <!-- ── Decorative underline accent ── -->
  <rect x="305" y="129" width="290" height="1.5" rx="1" fill="url(#headGrad)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="290;320;290" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="305;290;305" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Status pill ── -->
  <rect x="360" y="143" width="180" height="22" rx="11" fill="#0d1128" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5"/>
  <circle cx="376" cy="154" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="450" y="159" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    OPEN TO OPPORTUNITIES
  </text>
</svg>
